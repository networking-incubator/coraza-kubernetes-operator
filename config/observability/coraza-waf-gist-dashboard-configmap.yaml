# Grafana dashboard ConfigMap for the "Coraza WAF" dashboard, adapted from
# https://gist.github.com/rafaelvzago/488c22734d7606b6a4fa47bc06ba64e7#file-coraza-waf-json
# (job label rewritten from "coraza-waf-otc" to "coraza-envoy" to match this
# cluster's PodMonitor job relabeling).
#
# Discovered by the Grafana sidecar via the "grafana_dashboard: \"1\"" label
# (see grafana.sidecar.dashboards in openshift-grafana-only-values.yaml /
# kube-prometheus-stack-values.yaml). Deployed the same way as that file -
# manually for this session, not part of `make manifests`/`helm.sync`.
#
# Panel query note: several panels originally used a single PromQL selector
# like {__name__=~"waf_filter_tx_interruptions_.*_total", job="coraza-envoy"}
# wrapped in rate()/increase(). Because rule_id/phase are baked into the
# metric *name* (not a label - see panel 250's description), this regex
# matches multiple distinct series names at once, which Thanos's query
# engine cannot merge inside a range function ("vector cannot contain
# metrics with the same labelset"). Fixed by rewriting those 4 panel queries
# (251, 255, 258, 601) as explicit `or`-chains over the demo ruleset's 4
# known rule IDs (1001/2001/3001/3002, see config/samples/ruleset.yaml).
# This is demo-ruleset-specific: extend the chain if you add more rules.
#
# Every panel description explains what the metric means in plain language
# (not just the PromQL metric name).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coraza-waf-gist-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  coraza-waf-gist.json: |
    {
      "uid": "coraza-waf",
      "title": "Coraza WAF",
      "tags": [
        "coraza",
        "envoy",
        "otel",
        "security",
        "waf",
        "wasm"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 4,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus",
              "selected": true
            },
            "hide": 0
          },
          {
            "name": "engine",
            "type": "query",
            "label": "Engine",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values({__name__=~\"coraza_waf_.*\"}, engine)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all",
              "selected": true
            },
            "hide": 0,
            "definition": "label_values({__name__=~\"coraza_waf_.*\"}, engine)"
          },
          {
            "name": "gateway",
            "type": "query",
            "label": "Gateway",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values({__name__=~\"coraza_waf_.*\"}, gateway)",
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all",
              "selected": true
            },
            "hide": 0,
            "definition": "label_values({__name__=~\"coraza_waf_.*\"}, gateway)"
          },
          {
            "name": "rule_id",
            "type": "textbox",
            "label": "Rule ID",
            "current": {
              "text": "1001",
              "value": "1001"
            },
            "query": "1001",
            "hide": 0
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 100,
          "type": "row",
          "title": "OTC / WASM health (active)",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": [],
          "description": "Envoy and WASM health series scraped from the OpenTelemetry Collector sidecar (Prometheus job=coraza-envoy). The collector re-exports Envoy admin stats from 127.0.0.1:15090/stats/prometheus."
        },
        {
          "id": 101,
          "type": "timeseries",
          "title": "WASM plugin reload rate",
          "description": "How often the Coraza WASM plugin reloads. Success means a new binary or config took effect. Failures and backoffs mean Envoy could not load the plugin and is retrying. Spikes after an Engine or image change are normal; sustained failures are not.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "failure"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "red",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "backoff"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "orange",
                      "mode": "fixed"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "success"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "fixedColor": "green",
                      "mode": "fixed"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "sum(rate({__name__=~\"envoy_wasm_.*_vm_reload_success_total\", job=\"coraza-envoy\"}[5m]))",
              "legendFormat": "success",
              "refId": "A"
            },
            {
              "expr": "sum(rate({__name__=~\"envoy_wasm_.*_vm_reload_failure_total\", job=\"coraza-envoy\"}[5m]))",
              "legendFormat": "failure",
              "refId": "B"
            },
            {
              "expr": "sum(rate({__name__=~\"envoy_wasm_.*_vm_reload_backoff_total\", job=\"coraza-envoy\"}[5m]))",
              "legendFormat": "backoff",
              "refId": "C"
            }
          ]
        },
        {
          "id": 102,
          "type": "timeseries",
          "title": "WASM remote cache",
          "description": "OCI fetch cache for the WASM binary. Hits mean Envoy reused a cached image. Misses and fetches mean it pulled from the registry. Fetch failures usually point at registry auth, TLS, or network problems. Cache entries is the number of binaries currently held in memory.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 15,
                "showPoints": "never",
                "spanNulls": false
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "rate(envoy_wasm_remote_load_cache_hits_total{job=\"coraza-envoy\"}[5m])",
              "legendFormat": "hits",
              "refId": "A"
            },
            {
              "expr": "rate(envoy_wasm_remote_load_cache_misses_total{job=\"coraza-envoy\"}[5m])",
              "legendFormat": "misses",
              "refId": "B"
            },
            {
              "expr": "rate(envoy_wasm_remote_load_fetch_failures_total{job=\"coraza-envoy\"}[5m])",
              "legendFormat": "fetch failures",
              "refId": "C"
            },
            {
              "expr": "rate(envoy_wasm_remote_load_fetch_successes_total{job=\"coraza-envoy\"}[5m])",
              "legendFormat": "fetch successes",
              "refId": "D"
            },
            {
              "expr": "envoy_wasm_remote_load_cache_entries{job=\"coraza-envoy\"}",
              "legendFormat": "cache entries",
              "refId": "E"
            }
          ]
        },
        {
          "id": 103,
          "type": "stat",
          "title": "Active WASM VMs",
          "description": "Number of V8 WASM VMs currently running inside Envoy. Expect at least one per gateway worker that has the Coraza filter attached. A drop to zero means the plugin is not loaded.",
          "gridPos": {
