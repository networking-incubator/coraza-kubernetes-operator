# Grafana Loki datasource for kube-prometheus-stack (Loki is a separate Helm release).
# Merged by: make observability.prometheus.deploy when OBSERVABILITY_DATAPLANE=1

grafana:
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc:3100
      isDefault: false
      jsonData:
        maxLines: 1000
