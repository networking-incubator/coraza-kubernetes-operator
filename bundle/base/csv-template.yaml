    - name: Source Code
      url: https://github.com/networking-incubator/coraza-kubernetes-operator
    - name: Issue Tracker
      url: https://github.com/networking-incubator/coraza-kubernetes-operator/issues
    - name: Coraza WAF
      url: https://coraza.io/
  maintainers:
