apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  annotations:
    alm-examples: '[]'
    capabilities: Basic Install
    categories: Security, Networking
    # containerImage and createdAt are overwritten by hack/generate_bundle.py.
    containerImage: REPLACE_IMAGE
    createdAt: REPLACE_CREATED_AT
    # OperatorHub shows the first 135 characters of this on the package tile.
    description: Declarative Coraza Web Application Firewall protection for Kubernetes Gateways, enforced in Envoy through a WASM filter.
    repository: https://github.com/networking-incubator/coraza-kubernetes-operator
    support: networking-incubator
  name: coraza-kubernetes-operator.vREPLACE_VERSION
  namespace: placeholder
spec:
  apiservicedefinitions: {}
  customresourcedefinitions:
    owned:
      - description: Engine configures a Coraza WAF instance attached to a Gateway.
        displayName: Engine
        kind: Engine
        name: engines.waf.k8s.coraza.io
        version: v1alpha1
      - description: RuleSet defines an ordered set of WAF rules sourced from RuleSources.
        displayName: RuleSet
        kind: RuleSet
        name: rulesets.waf.k8s.coraza.io
        version: v1alpha1
      - description: RuleSource holds SecLang rule text for consumption by RuleSets.
        displayName: RuleSource
        kind: RuleSource
        name: rulesources.waf.k8s.coraza.io
        version: v1alpha1
      - description: RuleData holds data file content (e.g. for @pmFromFile) for consumption by RuleSets.
        displayName: RuleData
        kind: RuleData
        name: ruledata.waf.k8s.coraza.io
        version: v1alpha1
  description: |
    ## About

    The Coraza Kubernetes Operator (CKO) brings Web Application Firewall (WAF)
    protection to Kubernetes [Gateways](https://gateway-api.sigs.k8s.io/api-types/gateway/).
    It is built on [Coraza](https://coraza.io/), an open source,
    [OWASP ModSecurity SecLang](https://coraza.io/docs/seclang/directives/)
    compatible WAF engine, and enforces rules inside the Envoy proxy of the
    Gateway through a WebAssembly filter, so no traffic leaves the data path to
    be inspected.

    Source code, issue tracker and full documentation live at
    [networking-incubator/coraza-kubernetes-operator](https://github.com/networking-incubator/coraza-kubernetes-operator).

    ## Features

    The operator is driven entirely by custom resources:

    * **RuleSource** holds SecLang rule text. Each source is validated with
      Coraza on admission and reports `Validated`, `InvalidRules` or
      `ValidationSkipped` in its status, so a typo is caught before it can
      reach a Gateway.
    * **RuleData** holds data files such as IP or keyword lists used by
      operators like `@pmFromFile`.
    * **RuleSet** composes an ordered list of RuleSources plus any RuleData
      into one firewall configuration. The merged result is validated as a
      whole and checked for directives the WASM runtime cannot support.
    * **Engine** attaches a ready RuleSet to a named Gateway. The operator
      renders an Istio EnvoyFilter for it and serves the compiled
      configuration to Envoy over its own xDS/ECDS endpoint, so rule changes
      reach running proxies without restarting them.

    Rules are distributed over TLS and subscribers are authenticated with
    their Gateway pod ServiceAccount token, so only the Gateways an Engine
    targets can fetch a configuration.

    [OWASP CoreRuleSet](https://coreruleset.org/) can be loaded with the
    bundled `kubectl coraza generate coreruleset` plugin, which turns a CRS
    release into RuleSource and RuleData resources.

    ## Prerequisites

    Before creating an Engine:

    * **Kubernetes v1.32 or newer.**
    * **[Istio](https://istio.io/) must already be installed**, and the
      Gateway an Engine targets must be an Istio ingress Gateway. Istio is the
      only supported integration today, and only ingress Gateways are
      supported. The operator does not install Istio.
    * **Gateway API CRDs** must be present, as required by Istio's Gateway
      support.
    * Egress from the Gateway pods to the operator Service on port 18080 must
      be allowed, so Envoy can pull its configuration and the WASM module.

    ### Create the serving certificate before installing

    The operator serves its configuration and the WASM module to Envoy over
    TLS, and it does not issue that certificate itself. Create the Secret in
    the namespace the operator will be installed into, **before** installing:
    the pod does not start until the Secret exists.

    The Secret must be named `coraza-kubernetes-operator-serving-cert` and hold
    `ca.crt`, `tls.crt` and `tls.key`. The certificate must be valid for the
    operator Service name, `coraza-kubernetes-operator.<namespace>.svc`, and
    `ca.crt` must be the CA that signed it: the operator publishes that CA to
    the Gateways it configures, and they reject a chain it does not verify.

    With [cert-manager](https://cert-manager.io/), a self-signed issuer and a
    Certificate for that DNS name produce a Secret in exactly this shape. To
    create one by hand instead, generate a CA, sign a leaf for the Service
    name with it, and load all three files:

        kubectl create secret generic coraza-kubernetes-operator-serving-cert \
          --namespace <namespace> \
          --from-file=ca.crt=ca.crt \
          --from-file=tls.crt=tls.crt \
          --from-file=tls.key=tls.key

    Rotation is manual: replace the Secret and restart the operator so it
    republishes the new CA.
