  icon:
    - base64data: ""
      mediatype: image/png
  install:
    spec:
      clusterPermissions: []
      deployments: []
    strategy: deployment
  installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
  keywords:
    - waf
    - coraza
    - security
    - firewall
    - kubernetes
    - gateway
    - gateway-api
    - istio
    - envoy
    - modsecurity
    - seclang
    - owasp
    - coreruleset
