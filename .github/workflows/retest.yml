name: retest

permissions:
  contents: read

on:
  issue_comment:
    types: [created]

jobs:
  retest:
    if: >-
      github.event.issue.pull_request
      && contains(fromJSON('["MEMBER","OWNER"]'), github.event.comment.author_association)
      && (contains(format('{0}{1}{0}', fromJSON('"\n"'), github.event.comment.body), format('{0}/retest{0}', fromJSON('"\n"')))
          || contains(format('{0}{1}{0}', fromJSON('"\n"'), github.event.comment.body), format('{0}/retestall{0}', fromJSON('"\n"'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - name: checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: re-run jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RETEST_ALL: ${{ contains(format('{0}{1}{0}', fromJSON('"\n"'), github.event.comment.body), format('{0}/retestall{0}', fromJSON('"\n"'))) }}
        run: bash .github/scripts/retest.sh
