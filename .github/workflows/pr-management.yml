name: pr_management

permissions:
  contents: read

on:
    # SECURITY: pull_request_target runs with base-branch
    # privileges. CRITICAL: Always checkout base SHA
    # (github.event.pull_request.base.sha), NEVER the PR
    # head. Changing the checkout ref to PR head would allow
    # malicious PRs to execute arbitrary code with
    # PROJECT_MANAGEMENT_PAT.
    pull_request_target:
        types: [opened, synchronize, reopened]

jobs:
    triage:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.base.sha }}
                  sparse-checkout: tools/github_project_manager
                  persist-credentials: false

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  go-version-file: tools/github_project_manager/go.mod

            - name: Verify go module integrity
              working-directory: tools/github_project_manager
              run: go mod verify

            - name: Build project manager
              working-directory: tools/github_project_manager
              run: go build -o "${{ github.workspace }}/github_project_manager" .

            - name: Triage PR
              env:
                  GITHUB_TOKEN: ${{ secrets.PROJECT_MANAGEMENT_PAT }}
                  GITHUB_REPO_OWNER: ${{ github.repository_owner }}
                  GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  ./github_project_manager -v \
                    --owner "${GITHUB_REPO_OWNER}" \
                    --repo "${GITHUB_EVENT_REPOSITORY_NAME}" \
                    --issue "${PR_NUMBER}" \
                    triage-pr
