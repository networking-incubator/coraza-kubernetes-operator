# Minimal ruleset (~2 rules). Establishes the WASM-filter overhead floor:
# the cost of running the WAF at all, independent of rule count.
apiVersion: waf.k8s.coraza.io/v1alpha1
kind: RuleSource
metadata:
  name: perf-base
spec:
  rules: |
    SecRuleEngine On
    SecRequestBodyAccess On
    SecResponseBodyAccess Off
---
apiVersion: waf.k8s.coraza.io/v1alpha1
kind: RuleSource
metadata:
  name: perf-block-attack
spec:
  rules: |
    SecRule ARGS "@contains attack" \
      "id:1001,\
      phase:2,\
      deny,\
      status:403,\
      msg:'Blocked: attack keyword detected'"
---
apiVersion: waf.k8s.coraza.io/v1alpha1
kind: RuleSet
metadata:
  name: perf-ruleset
spec:
  sources:
    - name: perf-base
    - name: perf-block-attack
