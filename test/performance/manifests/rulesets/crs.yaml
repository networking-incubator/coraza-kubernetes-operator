    # &        &ifconfig
    # &&       &&ifconfig
    # \n       ;\nifconfig
    # \r       ;\rifconfig
    # \$\(     $(ifconfig)
    # \$\(\(   $((ifconfig))
    # \$\[     $[2+2]
    # `        `ifconfig`
    # \${      ${ifconfig}
    # <\(      <( ifconfig )
    # >\(      >( ifconfig )
    # \(\s*\)  a() ( ifconfig; ); a
    #
    # 2. Command prefixes
    #
    # {        { ifconfig }
    # \s*\(\s* ( ifconfig )
    # \w+=(?:[^\s]*|\$.*|\$.*|<.*|>.*|\'.*\'|\".*\")\s+   VARNAME=xyz ifconfig
    # !\s*     ! ifconfig
    # \$       $ifconfig
    #
    # 3. Quoting
    #
    # '        'ifconfig'
    # \"       "ifconfig"
    #
    # 4. Paths
    #
    # [\?\*\[\]\(\)\-\|+\w'\"\./\x5c]+/   /sbin/ifconfig, /s?in/./ifconfig, /s[a-b]in/ifconfig etc.
