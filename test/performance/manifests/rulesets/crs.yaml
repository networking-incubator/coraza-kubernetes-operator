        tag:'platform-multi',\
        tag:'attack-rce',\
        tag:'paranoia-level/2',\
        tag:'OWASP_CRS',\
        tag:'capec/1000/152/248',\
        tag:'PCI/6.5.2',\
        ver:'OWASP_CRS/4.7.0',\
        severity:'CRITICAL',\
        setvar:'tx.rce_score=+%{tx.critical_anomaly_score}',\
