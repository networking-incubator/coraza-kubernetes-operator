    #
    # Some generic snippets used:
    # - function() {
    # - new Function(
    # - eval(
    # - String.fromCharCode(
    #
    # Last two are used by nodejsshell.py,
    # https://github.com/ajinabraham/Node.Js-Security-Course/blob/master/nodejsshell.py
