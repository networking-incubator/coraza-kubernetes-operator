# Gateway + HTTPRoute for the performance test. GATEWAY_CLASS is substituted by
# setup.sh (istio on Kubernetes, openshift-default on OpenShift).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ${GATEWAY_NAME}
  # On Istio the data-plane Deployment/Service is derived from this Gateway
  # (named <gateway>-<class>); scale that Deployment for throughput headroom.
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: ${GATEWAY_CLASS}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
spec:
  parentRefs:
    - name: ${GATEWAY_NAME}
  rules:
    - backendRefs:
        - name: echo
          port: 80
