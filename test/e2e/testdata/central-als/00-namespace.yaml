apiVersion: v1
kind: Namespace
metadata:
  name: coraza-central-waf-telemetry
  labels:
    app.kubernetes.io/part-of: coraza-central-istio-waf-telemetry
    app.kubernetes.io/component: test-fixture
---
# Default-deny, then explicitly allow only OTLP ingress from Gateway proxies,
# Prometheus scrape ingress, and DNS egress for the central collector.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: central-waf-als-collector
  namespace: coraza-central-waf-telemetry
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: gateway.networking.k8s.io/gateway-name
                operator: Exists
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
