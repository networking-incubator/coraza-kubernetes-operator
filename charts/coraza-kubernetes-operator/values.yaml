image:
  repository: ghcr.io/networking-incubator/coraza-kubernetes-operator
  # Defaults to Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# NOTE: HA Presently Not Supported:
#  https://github.com/networking-incubator/coraza-kubernetes-operator/issues/38
replicas: 1

cache:
  # Deprecated and ignored: the legacy RuleSet cache server is not started, so
  # no garbage collection runs.
  gcInterval: "5m"

# Memory covers one maximal RuleSet compile on top of the cached rule objects;
# compile cost depends on the shape of the rules. See the sizing section of the
# Helm values reference. The operator sets its Go memory limit to 90% of
# limits.memory.
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 10m
    memory: 512Mi


metrics:
  enabled: true
  # Name of an existing Secret containing TLS certificate and key for the metrics endpoint.
  # When empty, controller-runtime generates a self-signed certificate automatically.
  certSecret: ""
  # Key names inside the certSecret (defaults: tls.crt, tls.key).
  certName: "tls.crt"
  keyName: "tls.key"
  # If the secret also contains a CA certificate, set caName so
  # the ServiceMonitor can verify the metrics endpoint. In
  # production, provide a CA to avoid insecureSkipVerify.
  caName: ""
  serviceMonitor:
    enabled: false
    # Labels merged into ServiceMonitor metadata.labels.
    # Use this to match your Prometheus instance's serviceMonitorSelector.
    # Example: additionalLabels: {release: kube-prometheus-stack}
    additionalLabels: {}
    # Additional metric relabelings applied to scraped samples.
    # See docs/content/reference/metrics-cardinality.md for worked examples and a full
    # cardinality budget analysis.
    # Example — drop info metrics to reduce series count in large clusters:
    #   metricRelabelings:
    #     - sourceLabels: [__name__]
    #       regex: 'coraza_(engine|ruleset)_info'
    #       action: drop
    metricRelabelings: []
    # Additional relabelings to apply to the scrape targets.
    relabelings: []
  prometheusRule:
    # When true, deploys a PrometheusRule CR with WAF alerting and recording rules.
    # Requires the monitoring.coreos.com/v1 CRD (Prometheus Operator).
    # Disabled by default — not all clusters have Prometheus Operator installed.
    enabled: false
    # Labels merged into PrometheusRule metadata.labels.
    # Use this to match your Prometheus instance's ruleSelector.
    # Example: additionalLabels: {release: kube-prometheus-stack}
    additionalLabels: {}
    # Additional alerting rules appended after the default rules.
    rules: []
  podMonitor:
    # When true, deploys a PodMonitor CR to scrape coraza_waf_* metrics
    # from Envoy stats on Gateway pods. Requires:
    # - monitoring.coreos.com/v1 CRD (Prometheus Operator)
    # - Istio with Envoy stats port 15090 (http-envoy-prom) exposed on Gateway pods
    # Disabled by default.
    enabled: false
    # Scrape interval for WAF data-plane metrics.
    interval: "30s"
    scrapeTimeout: "10s"
    # Label selector for Gateway pods. An empty selector matches ALL pods
    # in all namespaces — narrow this in production environments.
    # Example: gatewaySelector: {gateway.networking.k8s.io/gateway-name: my-gateway}
    gatewaySelector: {}
    # Labels merged into PodMonitor metadata.labels.
    # Use this to match your Prometheus instance's podMonitorSelector.
    # Example: additionalLabels: {release: kube-prometheus-stack}
    additionalLabels: {}
    # Port name on Gateway pods that exposes Envoy stats.
    # Default is the Istio convention; override for non-Istio service meshes.
    portName: "http-envoy-prom"
    # Additional metricRelabelings appended AFTER the mandatory cardinality guard.
    # The guard (keep only coraza_waf_.*) is always enforced first.
    metricRelabelings: []
  grafanaDashboard:
    # When true, deploys ConfigMap(s) containing Grafana dashboard JSON for the
    # kube-prometheus-stack (or compatible) Grafana dashboard sidecar.
    # Requires metrics.prometheusRule.enabled=true (health panels query recording
    # rules from the chart PrometheusRule) and a Grafana instance watching
    # ConfigMaps labeled grafana_dashboard=1.
    enabled: false
    # Folder name written to the grafana_folder ConfigMap annotation.
    folder: "Coraza WAF"
    # Labels merged into dashboard ConfigMap metadata.labels (in addition to grafana_dashboard).
    additionalLabels: {}

logging:
  # When true, uses console encoder with debug level (development mode).
  # When false (default), the settings below apply for production mode.
  development: false
  # Log encoding format. Applies when development=false.
  # Valid values: json, console
  encoder: json
  # Minimum log level. Applies when development=false.
  # Valid values: debug, info, error
  level: info
  # Minimum level at which stack traces are captured. Applies when development=false.
  # Valid values: info, error, panic
  stacktraceLevel: error
  # Timestamp encoding format. Applies when development=false.
  # Valid values: epoch, millis, nano, iso8601, rfc3339, rfc3339nano
  timeEncoding: rfc3339nano

istio:
  # When empty, the operator does not set an Istio revision label on managed resources.
  revision: ""

xds:
  # Per-peer-IP token bucket for failed ECDS authentication attempts. Successful
  # authentication does not consume the bucket.
  authFailureRate: 10
  authFailureBurst: 1024

# Cluster rule policy. It narrows what tenant rule text (RuleSource rules and
# the RuleData files they Include) may use below what envoy-coraza supports and
# never allows more; the bundled crs/ tree is not scanned. It applies to new or
# changed RuleSet content: a tightened policy applies to the next change of a
# RuleSet's content, does not report RuleSets whose accepted content it would
# refuse, and returning to the last accepted content is accepted. A violation
# marks the RuleSet Degraded with reason InvalidRuleSet; the policy is enforced
# on the RuleSet, so a RuleSource can show Validated while its RuleSet reports
# InvalidRuleSet. Only the operator should have write access to
# rulesets/status; the policy reads status.acceptedContent to tell accepted
# content from new content.
rulePolicy:
  # Operator names tenants may not use, without the "@" (e.g. [pmFromFile]).
  # Matched case-insensitively; an alias is denied with its operator (pmf with
  # pmFromFile). An operator envoy-coraza does not support fails startup.
  deniedOperators: []
  # Directive names tenants may not use (e.g. [SecRuleEngine, Include]), and
  # the ctl actions with the same effect. Matched case-insensitively; a
  # directive envoy-coraza does not support fails startup.
  deniedDirectives: []
  # Highest SecRequestBodyLimit accepted, in bytes: at most 16777216, the
  # envoy-coraza ceiling.
  maxRequestBodyLimit: 16777216
  # Allowed or Denied. Denied rejects SecResponseBodyAccess On.
  responseBodyAccess: Allowed
  # Most rules one RuleSet may hold (--rule-max-rules). Unlike the values
  # above, it applies to every RuleSet.
  maxRules: 20000

# Serving certificate for the ECDS and WASM asset endpoint. When existingSecret
# is empty and generate is true, `helm install`/`helm upgrade` create a
# self-signed CA and certificate valid for 365 days and reuse the generated
# Secret across upgrades via `lookup`.
#
# IMPORTANT: the reuse is a `helm install`/`helm upgrade` behavior only.
# `helm template`, `--dry-run`, and GitOps renderers (Argo CD, Flux) cannot
# read the cluster, so they mint a fresh CA on every render, which breaks the
# trust bundle inlined into EnvoyFilters. For those flows set generate=false
# and provide existingSecret (or provision the certificate with cert-manager).
#
# Rotation: delete the generated Secret and re-run `helm upgrade`, then restart
# the operator Deployment so it reloads the CA. Engines whose RuleSet is
# degraded do not publish the new CA until the RuleSet is repaired.
tls:
  # Name of an existing Secret in the release namespace with keys
  # ca.crt, tls.crt, and tls.key.
  existingSecret: ""
  # Generate a self-signed serving certificate (365-day CA and leaf) when
  # existingSecret is empty. Only safe for helm-managed installs; set to
  # false for static manifests and GitOps pipelines: no private key is
  # published, and the referenced Secret must already exist.
  generate: true
  certName: "tls.crt"
  keyName: "tls.key"
  caName: "ca.crt"
  # Extra DNS SANs appended when the serving certificate is generated. Changing
  # this list does not update a Secret reused by Helm; rotate the certificate
  # and restart the operator before using a newly added hostname.
  sans: []

networkPolicy:
  # The operator only opens outbound connections to the Kubernetes API server.
  # When enabled, the operator's NetworkPolicy also restricts egress to the
  # API server addresses and ports below (no DNS rule is added). Off by
  # default: the addresses depend on where the API server runs, and a stale
  # address cuts the operator off. See the Helm values reference before enabling.
  egress:
    enabled: false
    apiServer:
      # API server endpoint addresses in CIDR form (usually /32 or /128), for
      # example ["10.0.0.1/32"]
      # (use the node or control-plane addresses behind the kubernetes Service,
      # not the Service ClusterIP). When empty, `helm install`/`helm upgrade`
      # read them from the kubernetes EndpointSlice in the default namespace;
      # `helm template` and GitOps renderers cannot, so set them explicitly.
      cidrs: []
      # API server endpoint ports (the kubernetes Service port and the
      # endpoint's target port, for example 443 and 6443); at least one. When
      # the addresses are read from the EndpointSlice, its ports are added too.
      ports: [6443, 443]

# Deprecated and ignored. The Engine API no longer has spec.driver.wasm.image.
# Use the bundled module, or set spec.driver.wasm.url with sha256.
defaultWasmImage: ""

openshift:
  enabled: false

createNamespace: true

podSecurityStandard:
  version: latest  # v1.35

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
imagePullSecrets: []

# The Go memory limit is read from limits.memory at container start, so an
# in-place memory resize restarts the container to apply it.
resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: RestartContainer
