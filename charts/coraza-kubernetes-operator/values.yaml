image:
  repository: ghcr.io/networking-incubator/coraza-kubernetes-operator
  # Defaults to Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

#  https://github.com/networking-incubator/coraza-kubernetes-operator/issues/38
replicas: 1

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi


metrics:
  enabled: true
  # Name of an existing Secret containing TLS certificate and key for the metrics endpoint.
  # When empty, controller-runtime generates a self-signed certificate automatically.
  certSecret: ""
  # Key names inside the certSecret (defaults: tls.crt, tls.key).
  certName: "tls.crt"
  keyName: "tls.key"
  # If the secret also contains a CA certificate, set caName so
  # the ServiceMonitor can verify the metrics endpoint. In
  # production, provide a CA to avoid insecureSkipVerify.
  caName: ""
  serviceMonitor:
    enabled: false
    # Labels merged into ServiceMonitor metadata.labels.
    # Use this to match your Prometheus instance's serviceMonitorSelector.
    # Example: additionalLabels: {release: kube-prometheus-stack}
    additionalLabels: {}
    # Additional metric relabelings applied to scraped samples.
    # See docs/content/reference/metrics-cardinality.md for worked examples and a full
    # cardinality budget analysis.
    # Example — drop info metrics to reduce series count in large clusters:
    #   metricRelabelings:
    #     - sourceLabels: [__name__]
    #       regex: 'coraza_(engine|ruleset)_info'
    #       action: drop
    metricRelabelings: []
    # Additional relabelings to apply to the scrape targets.
    relabelings: []
  prometheusRule:
    # When true, deploys a PrometheusRule CR with WAF alerting and recording rules.
    # Requires the monitoring.coreos.com/v1 CRD (Prometheus Operator).
    # Disabled by default — not all clusters have Prometheus Operator installed.
    enabled: false
    # Labels merged into PrometheusRule metadata.labels.
    # Use this to match your Prometheus instance's ruleSelector.
    # Example: additionalLabels: {release: kube-prometheus-stack}
    additionalLabels: {}
    # Additional alerting rules appended after the default rules.
    rules: []
  podMonitor:
    # When true, deploys a PodMonitor CR to scrape coraza_waf_* metrics
    # from Envoy stats on Gateway pods. Requires:
    # - monitoring.coreos.com/v1 CRD (Prometheus Operator)
    # - Istio with Envoy stats port 15090 (http-envoy-prom) exposed on Gateway pods
    # Disabled by default.
    enabled: false
    # Scrape interval for WAF data-plane metrics.
    interval: "30s"
    scrapeTimeout: "10s"
    # Label selector for Gateway pods. An empty selector matches ALL pods
    # in all namespaces — narrow this in production environments.
    # Example: gatewaySelector: {gateway.networking.k8s.io/gateway-name: my-gateway}
    gatewaySelector: {}
    # Labels merged into PodMonitor metadata.labels.
    # Use this to match your Prometheus instance's podMonitorSelector.
    # Example: additionalLabels: {release: kube-prometheus-stack}
    additionalLabels: {}
    # Port name on Gateway pods that exposes Envoy stats.
    # Default is the Istio convention; override for non-Istio service meshes.
    portName: "http-envoy-prom"
    # Additional metricRelabelings appended AFTER the mandatory cardinality guard.
    # The guard (keep only coraza_waf_.*) is always enforced first.
    metricRelabelings: []
  grafanaDashboard:
    # When true, deploys ConfigMap(s) containing Grafana dashboard JSON for the
    # kube-prometheus-stack (or compatible) Grafana dashboard sidecar.
    # Requires metrics.prometheusRule.enabled=true (health panels query recording
    # rules from the chart PrometheusRule) and a Grafana instance watching
    # ConfigMaps labeled grafana_dashboard=1.
    enabled: false
    # Folder name written to the grafana_folder ConfigMap annotation.
    folder: "Coraza WAF"
    # Labels merged into dashboard ConfigMap metadata.labels (in addition to grafana_dashboard).
    additionalLabels: {}

logging:
  # When true, uses console encoder with debug level (development mode).
  # When false (default), the settings below apply for production mode.
  development: false
  # Log encoding format. Applies when development=false.
  # Valid values: json, console
  encoder: json
  # Minimum log level. Applies when development=false.
  # Valid values: debug, info, error
  level: info
  # Minimum level at which stack traces are captured. Applies when development=false.
  # Valid values: info, error, panic
  stacktraceLevel: error
  # Timestamp encoding format. Applies when development=false.
  # Valid values: epoch, millis, nano, iso8601, rfc3339, rfc3339nano
  timeEncoding: rfc3339nano

istio:
  # When empty, the operator does not set an Istio revision label on managed resources.
  revision: ""

# Serving certificate for the ECDS and WASM asset endpoint. When existingSecret
# is empty the chart generates a self-signed CA and certificate. The generated
# material is recreated on every upgrade; reuse across upgrades (Helm lookup)
# and the OpenShift service-serving certificate option are Phase 7.
tls:
  # Name of an existing Secret in the release namespace with keys
  # ca.crt, tls.crt, and tls.key.
  existingSecret: ""
  certName: "tls.crt"
  keyName: "tls.key"
  caName: "ca.crt"
  # Extra DNS SANs appended to the generated certificate.
  sans: []

openshift:
  enabled: false

createNamespace: true

podSecurityStandard:
  version: latest  # v1.35

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
imagePullSecrets: []

resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: NotRequired
