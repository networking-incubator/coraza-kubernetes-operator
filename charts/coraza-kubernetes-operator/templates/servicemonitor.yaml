{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "coraza-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coraza-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "coraza-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      scheme: https
      # Coraza CR metrics use a `namespace` label for the resource namespace. Without
      # honorLabels, Prometheus overwrites it with the operator pod namespace.
      # Operator metrics must not emit `job` or `instance` labels; the guard below
      # drops them if they ever appear so scrape-target identity stays authoritative.
      honorLabels: true
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        {{- if and .Values.metrics.certSecret .Values.metrics.caName }}
        ca:
          secret:
            name: {{ .Values.metrics.certSecret }}
            key: {{ .Values.metrics.caName }}
        {{- else }}
        # No CA provided; skip TLS verification for the
        # self-signed or unverifiable metrics certificate.
        insecureSkipVerify: true
        {{- end }}
      metricRelabelings:
        - action: labeldrop
          regex: ^(job|instance)$
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}