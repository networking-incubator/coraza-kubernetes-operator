apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coraza-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coraza-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "coraza-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "coraza-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 65532
        fsGroup: 65532
        {{- end }}
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - --leader-elect=true
            - --health-probe-bind-address=:8081
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8443
            {{- if .Values.metrics.certSecret }}
            - --metrics-cert-path=/etc/metrics-certs
            - --metrics-cert-name={{ .Values.metrics.certName | default "tls.crt" }}
            - --metrics-cert-key={{ .Values.metrics.keyName | default "tls.key" }}
            {{- end }}
            {{- end }}
            - --envoy-cluster-name={{ printf "outbound|80||%s" (include "coraza-operator.serviceFQDN" .) }}
            - --cache-gc-interval={{ .Values.cache.gcInterval }}
            {{- if .Values.istio.revision }}
            - --istio-revision={{ .Values.istio.revision }}
            {{- end }}
            - --operator-name={{ include "coraza-operator.fullname" . }}
            - --xds-cert-path=/etc/coraza-tls
            - --xds-cert-name={{ .Values.tls.certName | default "tls.crt" }}
            - --xds-key-name={{ .Values.tls.keyName | default "tls.key" }}
            - --xds-ca-path=/etc/coraza-tls/{{ .Values.tls.caName | default "ca.crt" }}
            {{- if .Values.tls.bootstrap }}
            - --xds-cert-secret={{ include "coraza-operator.servingCertSecretName" . }}
            {{- range .Values.tls.sans }}
            - --xds-cert-dns-name={{ . }}
            {{- end }}
            {{- end }}
            - --xds-auth-failure-rate={{ .Values.xds.authFailureRate }}
            - --xds-auth-failure-burst={{ .Values.xds.authFailureBurst }}
            - --xds-max-request-bytes={{ int .Values.xds.maxRequestBytes }}
            - --xds-write-timeout={{ .Values.xds.writeTimeout }}
            - --xds-max-connections-per-source={{ int .Values.xds.maxConnectionsPerSource }}
            {{- with .Values.rulePolicy }}
            {{- $policy := . }}
            {{- range $key := list "deniedOperators" "deniedDirectives" }}
            {{- $names := index $policy $key | default list }}
            {{- if not (kindIs "slice" $names) }}
            {{- fail (printf "rulePolicy.%s must be a list, got %v" $key (index $policy $key)) }}
            {{- end }}
            {{- range $names }}
            {{- if not (kindIs "string" .) }}
            {{- fail (printf "rulePolicy.%s entries must be strings, got %v" $key .) }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with compact (.deniedOperators | default list) }}
            - {{ printf "--rule-denied-operators=%s" (join "," .) | quote }}
            {{- end }}
            {{- with compact (.deniedDirectives | default list) }}
            - {{ printf "--rule-denied-directives=%s" (join "," .) | quote }}
            {{- end }}
            {{- $limit := .maxRequestBodyLimit }}
            {{- if or (not (include "coraza-operator.isInt" $limit)) (le (int64 $limit) 0) (gt (int64 $limit) 16777216) }}
            {{- fail (printf "rulePolicy.maxRequestBodyLimit must be an integer number of bytes from 1 to 16777216, got %v" $limit) }}
            {{- end }}
            {{- if not (has .responseBodyAccess (list "Allowed" "Denied")) }}
            {{- fail (printf "rulePolicy.responseBodyAccess must be Allowed or Denied, got %v" .responseBodyAccess) }}
            {{- end }}
            {{- if or (not (include "coraza-operator.isInt" .maxRules)) (le (int64 .maxRules) 0) }}
            {{- fail (printf "rulePolicy.maxRules must be a positive integer, got %v" .maxRules) }}
            {{- end }}
            - {{ printf "--rule-max-request-body-limit=%d" (int64 $limit) | quote }}
            - {{ printf "--rule-response-body-access=%s" .responseBodyAccess | quote }}
            - {{ printf "--rule-max-rules=%d" (int64 .maxRules) | quote }}
            {{- end }}
            {{- if .Values.defaultWasmImage }}
            - --default-wasm-image={{ .Values.defaultWasmImage }}
            {{- end }}
            {{- if .Values.logging.development }}
            - --zap-devel=true
            {{- else }}
            - --zap-devel=false
            - --zap-encoder={{ .Values.logging.encoder | default "json" }}
            - --zap-log-level={{ .Values.logging.level | default "info" }}
            - --zap-stacktrace-level={{ .Values.logging.stacktraceLevel | default "error" }}
            - --zap-time-encoding={{ .Values.logging.timeEncoding | default "rfc3339nano" }}
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: 8443
              protocol: TCP
          {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The operator sets its Go memory limit to 90% of this value.
            - name: MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          securityContext:
            runAsNonRoot: true
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - "ALL"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 20
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: xds-serving-cert
              mountPath: /etc/coraza-tls
              readOnly: true
            {{- if .Values.metrics.certSecret }}
            - name: metrics-certs
              mountPath: /etc/metrics-certs
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: xds-serving-cert
          secret:
            secretName: {{ include "coraza-operator.servingCertSecretName" . }}
            {{- if .Values.tls.bootstrap }}
            # The operator creates this Secret itself on first start, after the
            # pod is already scheduled. Without optional the kubelet would block
            # the mount forever and the operator could never create it.
            optional: true
            {{- end }}
        {{- if .Values.metrics.certSecret }}
        - name: metrics-certs
          secret:
            secretName: {{ .Values.metrics.certSecret }}
        {{- end }}
      serviceAccountName: {{ include "coraza-operator.serviceAccountName" . }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
