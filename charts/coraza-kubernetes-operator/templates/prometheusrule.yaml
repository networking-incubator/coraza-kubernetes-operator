{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "coraza-operator.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "coraza-operator.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: coraza-operator.alerts
      rules:
        # Reconcile error ratio above 10% over 5m window (errors / total reconciles).
        # Guard: when reconcile_total rate is 0 the division is NaN and the alert
        # does not fire.
        - alert: CorazaReconcileErrorRateHigh
          expr: >-
            (
              sum by (controller) (rate(controller_runtime_reconcile_errors_total{controller=~"ruleset|engine|rulesource"}[5m]))
              /
              sum by (controller) (rate(controller_runtime_reconcile_total{controller=~"ruleset|engine|rulesource"}[5m]))
              > 0.1
            )
            and
            sum by (controller) (rate(controller_runtime_reconcile_total{controller=~"ruleset|engine|rulesource"}[5m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Coraza operator reconcile error rate is high"
            description: 'Controller {{ "{{" }} $labels.controller {{ "}}" }} has reconcile error ratio {{ "{{" }} $value | humanizePercentage {{ "}}" }} over the last 5 minutes.'

        # Engine not ready for 5 minutes
        - alert: CorazaEngineNotReady
          expr: coraza:engines_not_ready:count > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "One or more Coraza Engines are not ready"
            description: '{{ "{{" }} $value {{ "}}" }} Engine resource(s) have been in non-Ready state for more than 5 minutes.'

        # RuleSet not ready for 5 minutes
        - alert: CorazaRuleSetNotReady
          expr: coraza:rulesets_not_ready:count > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "One or more Coraza RuleSets are not ready"
            description: '{{ "{{" }} $value {{ "}}" }} RuleSet resource(s) have been in non-Ready state for more than 5 minutes.'

        # Workqueue depth above 100 for 10 minutes
        - alert: CorazaWorkqueueDepthHigh
          expr: workqueue_depth{name=~"ruleset|engine|rulesource"} > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Coraza operator workqueue depth is high"
            description: 'Workqueue {{ "{{" }} $labels.name {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} items pending — reconciliation may be lagging.'

        # RuleSource validation failure rate above 20% over 5m (per namespace).
        # Requires sustained validation traffic to avoid firing on a single failure.
        - alert: CorazaRuleSourceValidationFailureRate
          expr: >-
            (sum by (namespace) (rate(coraza_rulesource_validations_total{outcome="invalid"}[5m]))
            /
            sum by (namespace) (rate(coraza_rulesource_validations_total[5m])))
            > 0.2
            and
            sum by (namespace) (rate(coraza_rulesource_validations_total[5m])) > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "RuleSource validation failure rate is high"
            description: 'Namespace {{ "{{" }} $labels.namespace {{ "}}" }} has {{ "{{" }} $value | humanizePercentage {{ "}}" }} RuleSource validation failure rate over the last 5 minutes.'

        # RuleSet aggregate validation failure rate above 20% over 5m (per namespace).
        - alert: CorazaRuleSetValidationFailureRate
          expr: >-
            (sum by (namespace) (rate(coraza_ruleset_validations_total{outcome="invalid"}[5m]))
            /
            sum by (namespace) (rate(coraza_ruleset_validations_total[5m])))
            > 0.2
            and
            sum by (namespace) (rate(coraza_ruleset_validations_total[5m])) > 0.01
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "RuleSet validation failure rate is high"
            description: 'Namespace {{ "{{" }} $labels.namespace {{ "}}" }} has {{ "{{" }} $value | humanizePercentage {{ "}}" }} RuleSet aggregate validation failure rate over the last 5 minutes.'

        # RuleSources in Degraded state
        - alert: CorazaRuleSourcesDegraded
          expr: coraza:rulesources_degraded:count > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "One or more RuleSources are degraded"
            description: '{{ "{{" }} $value {{ "}}" }} RuleSource(s) have been in Degraded state for more than 5 minutes.'

        # xDS serving certificate or CA chain expires within 30 days; $value is
        # the soonest of the two per pod. Both gauges are 0 until loaded, and
        # the trailing "> 0" leaves expired ones to CorazaXDSCertificateExpired.
        # A certificate issued for less than 30 days keeps this alert firing.
        - alert: CorazaXDSCertificateExpiringSoon
          expr: >-
            min by (namespace, pod) (
              {__name__=~"coraza_xds_serving_cert_not_after_seconds|coraza_xds_ca_not_after_seconds"} > 0
            ) - time() < 30 * 86400 > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Coraza xDS certificate expires soon"
            description: 'An xDS serving certificate or CA of pod {{ "{{" }} $labels.pod {{ "}}" }} expires in {{ "{{" }} $value | humanizeDuration {{ "}}" }}. Rotate it before Gateways stop trusting the operator.'

        # xDS serving certificate or CA chain has expired: Gateways can no
        # longer verify the operator, so ECDS and WASM fetches fail.
        - alert: CorazaXDSCertificateExpired
          expr: >-
            min by (namespace, pod) (
              {__name__=~"coraza_xds_serving_cert_not_after_seconds|coraza_xds_ca_not_after_seconds"} > 0
            ) - time() <= 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Coraza xDS certificate has expired"
            description: 'An xDS serving certificate or CA of pod {{ "{{" }} $labels.pod {{ "}}" }} has expired. Gateways cannot receive WAF configuration until it is rotated.'

        {{- with .Values.metrics.prometheusRule.rules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

    - name: coraza-operator.recording
      rules:
        # Aggregate Engine readiness into a scalar for low-cardinality alerting.
        # Using count() avoids per-Engine alert storms.
        #
        # DEPENDENCY: coraza_engine_condition and coraza_ruleset_condition are emitted
        # by the operator's controller metrics (internal/controller/metrics.go).
        # These recording rules (and the CorazaEngineNotReady / CorazaRuleSetNotReady
        # alerts that depend on them) will produce a constant 0 via the `or vector(0)`
        # fallback — meaning the alerts will never fire — until the operator is
        # running and has reconciled at least one Engine or RuleSet.
        #
        # != 1 catches both False (0) and Unknown (-1) condition states.
        - record: coraza:engines_not_ready:count
          expr: count(coraza_engine_condition{condition="Ready"} != 1) or vector(0)

        - record: coraza:rulesets_not_ready:count
          expr: count(coraza_ruleset_condition{condition="Ready"} != 1) or vector(0)

        - record: coraza:rulesources_degraded:count
          expr: count(coraza_rulesource_condition{condition="Degraded"} == 1) or vector(0)

{{- end }}
