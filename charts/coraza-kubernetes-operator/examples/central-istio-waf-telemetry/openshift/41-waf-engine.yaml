# Coraza Engine: attaches RuleSet to waf-gateway via Istio WasmPlugin.
# WASM image: coraza-proxy-wasm PR #20+ (Envoy filter state for CIO ALS).
apiVersion: waf.k8s.coraza.io/v1alpha1
kind: Engine
metadata:
  name: waf-engine
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: coraza-central-istio-waf-telemetry
spec:
  ruleSet:
    name: waf-ruleset
  target:
    type: Gateway
    name: waf-gateway
    provider: Istio
  failurePolicy: fail
  observability:
    mode: Enabled
  driver:
    type: wasm
    wasm:
      image: oci://ghcr.io/networking-incubator/coraza-proxy-wasm:e20b40ca25e3c50f212999e3decfde5503e630c3
