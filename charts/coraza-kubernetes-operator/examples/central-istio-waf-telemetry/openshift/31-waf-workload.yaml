# Sample backend + openshift-default Gateway + HTTPRoute for WAF telemetry tests.
# OpenShift Ingress owns this namespace so gateway DNS and load-balancing
# behaviour match the CIO-managed GatewayClass.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: coraza-central-istio-waf-telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/gateway-api/conformance/echo-basic:v0.1.0
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: coraza-central-istio-waf-telemetry
spec:
  selector:
    app: echo
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waf-gateway
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: coraza-central-istio-waf-telemetry
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-route
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/part-of: coraza-central-istio-waf-telemetry
spec:
  parentRefs:
    - name: waf-gateway
  rules:
    - backendRefs:
        - name: echo
          port: 80
