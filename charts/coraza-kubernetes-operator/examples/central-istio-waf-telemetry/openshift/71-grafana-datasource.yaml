# Before applying this resource, create central-waf-grafana-thanos-token with
# a THANOS_TOKEN key as documented in openshift/README.md. Never commit that
# token to this repository.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: central-waf-openshift-user-workload-prometheus
  namespace: coraza-central-waf-telemetry
  labels:
    app.kubernetes.io/part-of: coraza-central-istio-waf-telemetry
spec:
  # The recovered coraza-waf.json dashboard already references this UID.
  uid: prometheus
  # This demonstrator namespace owns a single Grafana instance. An empty
  # selector avoids the Grafana Operator v5 selector regression on OpenShift.
  instanceSelector: {}
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          name: central-waf-grafana-thanos-token
          key: THANOS_TOKEN
  datasource:
    name: Prometheus
    type: prometheus
    access: proxy
    isDefault: true
    editable: false
    url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
    jsonData:
      httpHeaderName1: Authorization
      timeInterval: 30s
      tlsSkipVerify: true
    secureJsonData:
      httpHeaderValue1: Bearer ${THANOS_TOKEN}
